name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Next 16 does not lint during build, so this has to be its own step.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
